
trigger: none 
jobs:
- job: Build
  pool:
    name: Self
  variables:
    - group: keys
    - name: NUGET_PACKAGES
      value: $(Pipeline.Workspace)\.nuget\packages\  
  steps:
    - checkout: self
    - task: AzurePowerShell@5
      name: Build
      inputs:
        errorActionPreference: stop
        azureSubscription: '2026_1'
        ScriptType: 'InlineScript'
        azurePowerShellVersion: 'LatestVersion'
        pwsh: true
        Inline: |
          Write-Host "Start build"
          $ErrorView="NormalView"
          "Nugetpackage=$env:Nuget_PACKAGES"
          $ErrorActionPreference="stop"
          $goArgs = @{
              GithubToken              = '$(GitHubToken)'
              AzureToken               = '$(AzureToken)' 
              GitHubUserName           = '$(GitHubUserName)' 
              DXApiFeed                = '$(DXApiFeed)'
              Branch                   = '$(Build.SourceBranchName)'
              SourcePath               = '$(System.DefaultworkingDirectory)'
              ArtifactStagingDirectory = '$(Build.Artifactstagingdirectory)'
              BinDirectory             = '$(System.DefaultworkingDirectory)\bin'
              CustomVersion            = '$(CustomVersion)'
              UseLastVersion           = '$(UseLastVersion)'
              XpandBlobOwnerSecret     = '$(XpandBlobOwnerSecret)'
              AzureApplicationId       = '$(AzureApplicationId)'
              AzureTenantId            = '$(AzureTenantId)'
              DXLicense                = '$(DXLicense)'
          }
          "goArgs:"
          $goArgs | Out-String
          $env:AzureToken=$AzureToken
          $env:AzOrganization="eXpandDevops"
          $env:AzProject ="eXpandFramework"
          & '$(System.DefaultWorkingDirectory)\Build\BuildPipeline.ps1' @goArgs
    - task: PublishPipelineArtifact@1
      displayName: 'Publish TestBlazorApplication'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)\src\Tests\TestApplication.Blazor.Server'
        artifact: 'TestBlazorApplication'
    - task: PublishPipelineArtifact@1
      displayName: 'Publish TestAssemblies'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)\bin\'
        artifact: 'TestAssemblies'
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Agent Nuget'
      inputs:
        targetPath: '$(Pipeline.Workspace)\.nuget'
        artifact: 'Nuget'
    - task: PublishPipelineArtifact@1
      name: PublishXpandNugets
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)\bin\Nupkg'
        artifact: 'Nupkg'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      name: PublishZips
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)\bin\zip'
        artifact: 'Zip'
        publishLocation: 'pipeline'           
- job: Tests
  dependsOn: Build
  condition: ne(variables['SkipTests'], 'True')
  timeoutInMinutes: 90
  cancelTimeoutInMinutes: 2
  strategy:
    matrix:
      Workflow:
        TestAssembly: '**/Xpand.XAF.Modules.Workflow.Tests.dll'
      # HideToolBar:
      #   TestAssembly: '**/Xpand.XAF.Modules.HideToolBar.Tests.dll'
      # JobSchedulerHangfire:
      #   TestAssembly: '**/Xpand.XAF.Modules.JobScheduler.Hangfire.Tests.dll'
      # JobSchedulerNotification:
      #   TestAssembly: '**/Xpand.XAF.Modules.JobScheduler.Notification.Tests.dll'
      ModelMapper:
        TestAssembly: '**/Xpand.XAF.Modules.ModelMapper.Tests.dll'
      Relay:
        TestAssembly: '**/Xpand.Extensions.Reactive.Relay.Tests.dll'
      Reactive:
        TestAssembly: '**/Xpand.XAF.Modules.Reactive.Tests.dll'
      OfficeDocumentStyleManager:
        TestAssembly: '**/Xpand.XAF.Modules.Office.DocumentStyleManager.Tests.dll'
      Extensions:
        TestAssembly: '**/Xpand.Extensions.Tests.dll'
      Channel:
        TestAssembly: '**/Xpand.Extensions.Reactive.Channel.Tests.dll'
      ReactiveLogger:
        TestAssembly: '**/Xpand.XAF.Modules.Reactive.Logger.Tests.dll'
      # ReactiveLoggerHub:
      #   TestAssembly: '**/Xpand.XAF.Modules.Reactive.Logger.Hub.Tests.dll'
      # ReactiveRest:
      #   TestAssembly: '**/Xpand.XAF.Modules.Reactive.Rest.Tests.dll'
      CloneModelView:
        TestAssembly: '**/Xpand.XAF.Modules.CloneModelView.Tests.dll'
      SuppressConfirmation:
        TestAssembly: '**/Xpand.XAF.Modules.SuppressConfirmation.Tests.dll'
      ViewEditMode:
        TestAssembly: '**/Xpand.XAF.Modules.ViewEditMode.Tests.dll'
      ViewItemValue:
        TestAssembly: '**/Xpand.XAF.Modules.ViewItemValue.Tests.dll'
      MasterDetail:
        TestAssembly: '**/Xpand.XAF.Modules.MasterDetail.Tests.dll'
      Email:
        TestAssembly: '**/Xpand.XAF.Modules.Email.Tests.dll'
      ModelViewInheritance:
        TestAssembly: '**/Xpand.XAF.Modules.ModelViewInheritance.Tests.dll'
      BulkObjectUpdate:
        TestAssembly: '**/Xpand.XAF.Modules.BulkObjectUpdate.Tests.dll'
      RefreshView:
        TestAssembly: '**/Xpand.XAF.Modules.RefreshView.Tests.dll'
      CloneMemberValue:
        TestAssembly: '**/Xpand.XAF.Modules.CloneMemberValue.Tests.dll'
      GridListEditor:
        TestAssembly: '**/Xpand.XAF.Modules.GridListEditor.Tests.dll'
      AutoCommit:
        TestAssembly: '**/Xpand.XAF.Modules.AutoCommit.Tests.dll'
  pool:
    name: Self
  variables:
  - group: keys
  - name: SOURCE_DIRECTORY
    value: '$(Build.SourcesDirectory)'
  steps:
    - checkout: Self
    - download: current
      artifact: TestAssemblies
      displayName: TestAssemblies
    - download: current
      artifact: Nupkg
      displayName: Nupkg
    - download: current
      artifact: Nuget
      displayName: Nuget
    - download: current
      artifact: TestBlazorApplication
      displayName: TestBlazorApplication
    - task: PowerShell@2
      displayName: 'Setup Environment'
      env:
        DX_LICENSE: $(DXLicense)
      inputs:
        targetType: 'inline'
        script: |
          New-Item -ItemType Directory -Force -Path "$(Build.SourcesDirectory)/bin/nupkg"
          Copy-Item -Path "$(Pipeline.Workspace)/Nupkg/*.nupkg" -Destination "$(Build.SourcesDirectory)/bin/nupkg"
          Get-ChildItem -Path "$(Pipeline.Workspace)\Nuget" -Recurse | ForEach-Object {
              $destinationPath = $_.FullName.Replace("$(Pipeline.Workspace)\Nuget", "$(Pipeline.Workspace)\.Nuget")
              $destinationDir = [System.IO.Path]::GetDirectoryName($destinationPath)
              if (-not (Test-Path -Path $destinationDir)) {
                  New-Item -ItemType Directory -Path $destinationDir -Force
              }
              if (-not (Test-Path -Path $destinationPath)) {
                  Move-Item -Path $_.FullName -Destination $destinationPath
              }
          }
          $blazorDest = "$(Build.SourcesDirectory)\src\Tests\TestApplication.Blazor.Server"
          $blazorSource = "$(Pipeline.Workspace)\TestBlazorApplication"
          Write-Host "Copying TestBlazorApplication from $blazorSource to $blazorDest"
          Copy-Item -Path "$blazorSource\*" -Destination $blazorDest -Recurse -Force
          Write-Host "Locating Visual Studio installation root..."
          
          # 1. Get the root path of the installation (ignore components/files for now)
          $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          
          if (-not $vsRoot) {
              throw "Visual Studio installation not found via vswhere."
          }
          Write-Host "Root found: $vsRoot"
          
          # 2. Native PowerShell search for the executable inside the root
          Write-Host "Searching for vstest.console.exe..."
          $vstest = Get-ChildItem -Path $vsRoot -Filter "vstest.console.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if (-not $vstest) {
              Write-Error "Could not find 'vstest.console.exe' anywhere in '$vsRoot'."
              Write-Error "Please ensure the 'Desktop development with C#' workload or 'Test Adapter for Google Test' component is installed."
              exit 1
          }
          
          Write-Host "Found VSTest at: $($vstest.FullName)"
          Write-Host "##vso[task.setvariable variable=VsTestPath]$($vstest.FullName)"

          $env:DevExpress_License = $env:DX_LICENSE
          $licensePath = "$env:APPDATA\DevExpress\DevExpress_License.txt"
          
          Write-Host "Starting DevExpress license setup"
          $dir = Split-Path $licensePath
          Write-Host "Ensuring directory exists: $dir"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          
          Write-Host "Writing license file to: $licensePath"
          Set-Content -Path $licensePath -Value $env:DX_LICENSE -Encoding UTF8
          
          if (Test-Path $licensePath) {
              Write-Host "License file successfully written in $licensePath"
          } else {
              Write-Error "License file not found at $licensePath after write."
          }
    - task: VSTest@3
      displayName: 'Run Tests'
      retryCountOnTaskFailure: 2
      inputs:
        minimumExpectedTests: "1"
        failOnMinTestsNotRun: true
        testSelector: 'testAssemblies'
        testAssemblyVer2: |
          $(TestAssembly)
          !**\*TestAdapter.dll
          !**\obj\**
        searchFolder: '$(Pipeline.Workspace)/TestAssemblies'
        runSettingsFile: '$(SOURCE_DIRECTORY)\Build\Tests.runsettings'
        vstestLocationMethod: 'location'
        vstestLocation: '$(VsTestPath)'
        otherConsoleOptions: '/Blame /Diag:$(Agent.TempDirectory)\vstest_diag.log'
        diagnosticsEnabled: true
- job: PostTestTasks
  dependsOn:
    - Tests
  condition: or(succeeded(), eq(dependencies.Tests.result, 'Skipped'))
  pool:
    name: Self
  variables:
    - group: keys
    - name: NUGET_PACKAGES
      value: $(Pipeline.Workspace)\.nuget\packages\  
  steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          $ErrorView="NormalView"
          $ErrorActionPreference="Stop"
          
          try {
            $env:AzureToken='$(AzureToken)'
            $env:AzProject="eXpandFramework"
            $env:AzOrganization="eXpandDevOps"
            
            Write-Host "Environment variables set"
            
            # & '$(System.DefaultWorkingDirectory)\go.ps1' -InstallModules
            
            $xafMinors=Get-XAFLatestMinors -Source '$(DXApiFeed)'
            $xafMinor=$xafMinors|select-object -first 1
            $parameters = @{
              CustomVersion     = "$xafminor"
              DxPipelineBuildId = '$(Build.BuildId)'
            }
            $parameters
            Add-AzBuild -Definition PublishNugets-Reactive.XAF -Parameters $parameters -Branch $env:Build_SourceBranchName
            Write-Host "Hello World"
          }
          catch {
            Write-Host "An error occurred:"
            Write-Host $_.Exception.Message
            Write-Host $_.ScriptStackTrace
            throw
          }
        failOnStderr: true
        ignoreLASTEXITCODE: true
        pwsh: true

       


